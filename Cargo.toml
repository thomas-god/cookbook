[workspace]
resolver = "3"
members = [
    "crates/cookbook-domain",
    "crates/cookbook-infra",
    "crates/cookbook-app",
]
default-members = ["crates/cookbook-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
base64 = "0.22"
derive_more = { version = "2.1.1", features = ["add", "constructor"] }
getrandom = "0.4"
mockall = "0.15"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.29.0", features = ["v4"] }

cookbook-domain = { path = "crates/cookbook-domain" }
cookbook-infra = { path = "crates/cookbook-infra" }

[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false
