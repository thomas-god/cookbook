[workspace]
resolver = "3"
members = [
    "crates/cookbook-domain",
    "crates/cookbook-infra",
    "crates/cookbook-vision",
    "crates/cookbook-app",
]
default-members = ["crates/cookbook-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
base64 = "0.22"
chrono = "0.4"
derive_more = { version = "2.1.1", features = ["add", "constructor"] }
getrandom = "0.4"
hayro = { version = "0.9", features = ["embed-fonts"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
mockall = "0.15"
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ureq = { version = "3.5.1", features = ["json"] }
uuid = { version = "1.29.0", features = ["v4", "v7"] }

cookbook-domain = { path = "crates/cookbook-domain" }
cookbook-infra = { path = "crates/cookbook-infra" }
cookbook-vision = { path = "crates/cookbook-vision" }

[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false
