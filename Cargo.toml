[workspace]
resolver = "3"
members = [
    "crates/cookbook-config",
    "crates/cookbook-domain",
    "crates/cookbook-export",
    "crates/cookbook-infra",
    "crates/cookbook-vision",
    "crates/cookbook-app",
]
default-members = ["crates/cookbook-app"]

[workspace.package]
version = "0.1.1"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
base64 = "0.23"
chrono = "0.4"
cron = "0.17"
derive_more = { version = "2.1.1", features = ["add", "constructor"] }
form_urlencoded = "1"
getrandom = "0.4"
hayro = { version = "0.9", features = ["embed-fonts"] }
rpassword = "7.5.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
mockall = "0.15"
printpdf = { version = "0.12", default-features = false, features = ["jpeg", "png"] }
schemars = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite-bundled",
    "migrate",
    "macros",
] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ureq = { version = "3.5.1", features = ["json"] }
uuid = { version = "1.29.0", features = ["v4", "v7"] }

cookbook-config = { path = "crates/cookbook-config" }
cookbook-domain = { path = "crates/cookbook-domain" }
cookbook-export = { path = "crates/cookbook-export" }
cookbook-infra = { path = "crates/cookbook-infra" }
cookbook-vision = { path = "crates/cookbook-vision" }

[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false
